<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" fill="none" role="img" aria-label="Fahim Abrar, Cybersecurity Engineer">
  <defs>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E6EDF3" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E6EDF3" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#E6EDF3" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#21262D"/>
    </pattern>
    <clipPath id="card">
      <rect x="1" y="1" width="1198" height="298" rx="16"/>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="1198" height="298" rx="16" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>

  <g clip-path="url(#card)">
    <rect x="600" y="0" width="600" height="300" fill="url(#dots)" opacity="0.7"/>

    <g stroke="#30363D" stroke-width="1.5">
      <line x1="980" y1="80" x2="1070" y2="58"/>
      <line x1="980" y1="80" x2="1050" y2="150"/>
      <line x1="1070" y1="58" x2="1122" y2="118"/>
      <line x1="1050" y1="150" x2="1122" y2="118"/>
      <line x1="1050" y1="150" x2="998" y2="212"/>
      <line x1="1122" y1="118" x2="1148" y2="196"/>
    </g>
    <g fill="#8B949E">
      <circle cx="980" cy="80" r="4"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="1070" cy="58" r="4"><animate attributeName="opacity" values="1;0.35;1" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="1122" cy="118" r="4"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="1050" cy="150" r="5.5" fill="#E6EDF3"><animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="998" cy="212" r="4"><animate attributeName="opacity" values="1;0.4;1" dur="2.9s" repeatCount="indefinite"/></circle>
      <circle cx="1148" cy="196" r="3.5"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/></circle>
    </g>

    <rect x="-180" y="0" width="180" height="300" fill="url(#scan)">
      <animate attributeName="x" values="-180;1200" dur="5.5s" repeatCount="indefinite"/>
    </rect>

    <text x="64" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#8B949E">&gt; secops@njccic:~$ ./monitor --agencies 45 <tspan fill="#E6EDF3">&#9608;<animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>

    <text x="62" y="172" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="74" font-weight="800" fill="#E6EDF3" letter-spacing="3">FAHIM ABRAR</text>

    <text x="64" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#8B949E" letter-spacing="0.5">Cybersecurity Engineer &#183; Security Operations &#183; Vulnerability Research</text>

    <text x="64" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#6E7681" letter-spacing="0.5">[ NJCCIC / NJOHSP ]&#160;&#160;&#160;[ CMU Heinz Fellow ]&#160;&#160;&#160;[ Rowan University '26 ]</text>
  </g>
</svg>
