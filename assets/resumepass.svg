<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" fill="none" role="img" aria-label="ResumePass ATS matching">
  <defs>
    <linearGradient id="rScan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E6EDF3" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E6EDF3" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#E6EDF3" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="rCard"><rect x="1" y="1" width="598" height="318" rx="14"/></clipPath>
    <clipPath id="rDoc"><rect x="64" y="56" width="236" height="210" rx="10"/></clipPath>
  </defs>

  <rect x="1" y="1" width="598" height="318" rx="14" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>

  <g clip-path="url(#rCard)">
    <!-- document -->
    <rect x="64" y="56" width="236" height="210" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <g clip-path="url(#rDoc)">
      <rect x="86" y="80" width="120" height="12" rx="4" fill="#E6EDF3" opacity="0.85"/>
      <rect x="86" y="104" width="190" height="7" rx="3.5" fill="#30363D"/>
      <rect x="86" y="120" width="170" height="7" rx="3.5" fill="#30363D"/>
      <rect x="86" y="136" width="188" height="7" rx="3.5" fill="#30363D"/>
      <rect x="86" y="164" width="96" height="9" rx="4" fill="#8B949E"/>
      <rect x="86" y="184" width="190" height="7" rx="3.5" fill="#30363D"/>
      <rect x="86" y="200" width="150" height="7" rx="3.5" fill="#30363D"/>
      <rect x="86" y="224" width="96" height="9" rx="4" fill="#8B949E"/>
      <rect x="86" y="244" width="178" height="7" rx="3.5" fill="#30363D"/>
      <!-- downward scan highlight -->
      <rect x="64" y="-60" width="236" height="60" fill="url(#rScan)">
        <animate attributeName="y" values="-60;266" dur="3.4s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- match score gauge -->
    <g>
      <circle cx="446" cy="150" r="62" fill="none" stroke="#30363D" stroke-width="10"/>
      <circle cx="446" cy="150" r="62" fill="none" stroke="#E6EDF3" stroke-width="10" stroke-linecap="round"
              stroke-dasharray="389.5" stroke-dashoffset="389.5" transform="rotate(-90 446 150)">
        <animate attributeName="stroke-dashoffset" values="389.5;74" dur="1.8s" fill="freeze"/>
      </circle>
      <text x="446" y="146" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#E6EDF3">92</text>
      <text x="446" y="168" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8B949E" letter-spacing="2">ATS MATCH</text>
    </g>

    <!-- check badge -->
    <g transform="translate(286,70)">
      <circle r="18" fill="#0D1117" stroke="#E6EDF3" stroke-width="2"/>
      <path d="M-8 0 L-2.5 6 L9 -7" fill="none" stroke="#E6EDF3" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="384" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#6E7681">tailored &#183; STAR prep &#183; local-only</text>
  </g>
</svg>
